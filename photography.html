  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lbClose">CLOSE ✕</button>
    <button class="lb-nav lb-prev" id="lbPrev">‹</button>
    <img id="lbImg" src="" alt="">
    <button class="lb-nav lb-next" id="lbNext">›</button>
    <div class="lb-count" id="lbCount"></div>

  <script src="js/main.js"></script>
  <script>
    (function(){
      const items = Array.from(document.querySelectorAll('#photoGrid .p-item'));
      const urls = items.map(el => el.querySelector('img').getAttribute('src'));
      let current = 0;

      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lbImg');
      const lbCount = document.getElementById('lbCount');

      function openAt(i){
        current = i;
        lbImg.src = urls[current];
        lbCount.textContent = (current + 1) + ' / ' + urls.length;
        lb.classList.add('open');
        requestAnimationFrame(() => lb.classList.add('show'));
        document.body.style.overflow = 'hidden';
      }
      function closeLb(){
        lb.classList.remove('show');
        document.body.style.overflow = '';
        setTimeout(() => lb.classList.remove('open'), 300);
      }
      function next(){ openAt((current + 1) % urls.length); }
      function prev(){ openAt((current - 1 + urls.length) % urls.length); }

      items.forEach((el, i) => el.addEventListener('click', () => openAt(i)));
      document.getElementById('lbClose').addEventListener('click', closeLb);
      document.getElementById('lbNext').addEventListener('click', next);
      document.getElementById('lbPrev').addEventListener('click', prev);
      lb.addEventListener('click', (e) => { if (e.target === lb) closeLb(); });
      document.addEventListener('keydown', (e) => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') closeLb();
        if (e.key === 'ArrowRight') next();
        if (e.key === 'ArrowLeft') prev();
      });

      // Scroll-reveal entrance — falls back to instantly visible if IntersectionObserver isn't available.
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in-view');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });
        items.forEach(el => io.observe(el));
      } else {
        items.forEach(el => el.classList.add('in-view'));
      }
    })();
  </script>
